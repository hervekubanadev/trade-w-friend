name: jewelry_ledger
description: "Kiosk business management system - full-screen, PIN-protected kiosk app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.7.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  lucide_icons_flutter: ^3.1.14+2
  google_nav_bar: ^5.0.6
  fl_chart: ^0.70.2
  crypto: ^3.0.7
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A1C2E"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
